name: CI

# Se ejecuta en cada push y en cada pull request hacia la rama principal
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Lint y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el codigo con ESLint
        run: npm run lint

      # Si una prueba falla, npm test termina con error y la ejecucion queda en rojo
      - name: Ejecutar pruebas
        run: npm test
